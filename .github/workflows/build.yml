name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      # Every QA suite plus the live residue tests on a headless game test server. The server exits with the number
      # of failed required tests, so any failure fails this step (and the job). About half a minute after the build.
      - name: Game tests
        timeout-minutes: 15
        run: ./gradlew runGameTestServer

      - name: Upload game test report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: |
            build/gametest/report.xml
            run/gametest/logs/latest.log
          if-no-files-found: ignore
